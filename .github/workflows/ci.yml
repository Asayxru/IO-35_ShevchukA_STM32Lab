name: CI

on:
  pull_request:
  push:
    branches:
      - lab2

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build toolchain image
        run: make docker

      - name: Build STM32 firmware
        run: make build

      - name: Run host tests
        run: make test

      - name: Check architecture
        run: make check-architecture
